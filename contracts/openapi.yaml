components:
  schemas:
    Account:
      properties:
        email:
          type: string
          title: Email
        merchant_name:
          type: string
          title: Merchant Name
        mode:
          type: string
          title: Mode
        csrf_token:
          type: string
          title: Csrf Token
      additionalProperties: false
      type: object
      required:
      - email
      - merchant_name
      - mode
      - csrf_token
      title: Account
    Analysis:
      properties:
        analysis_id:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          title: Analysis Id
        transaction_id:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          title: Transaction Id
        status:
          type: string
          enum:
          - queued
          - processing
          - completed
          - failed
          title: Status
        findings:
          items:
            $ref: '#/components/schemas/Finding'
          type: array
          title: Findings
        draft_response:
          anyOf:
          - type: string
          - type: 'null'
          title: Draft Response
        merchant_approval_required:
          type: boolean
          const: true
          title: Merchant Approval Required
      additionalProperties: false
      type: object
      required:
      - analysis_id
      - transaction_id
      - status
      - findings
      - draft_response
      - merchant_approval_required
      title: Analysis
    AnalysisDetails:
      properties:
        analysis_id:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          title: Analysis Id
        engine:
          type: string
          const: ai_engine_v1
          title: Engine
          default: ai_engine_v1
        failure_code:
          anyOf:
          - type: string
            enum:
            - PIPELINE_TIMEOUT
            - PIPELINE_ERROR
            - INVALID_PIPELINE_OUTPUT
          - type: 'null'
          title: Failure Code
        result:
          anyOf:
          - $ref: '#/components/schemas/PipelineResult'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - analysis_id
      title: AnalysisDetails
    AnalyzeRequest:
      properties: {}
      additionalProperties: false
      type: object
      title: AnalyzeRequest
      description: 'Reserved integration boundary: only an empty JSON object is accepted.'
    ApproveDraft:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
        acknowledge_warnings:
          type: boolean
          title: Acknowledge Warnings
          default: false
      additionalProperties: false
      type: object
      required:
      - version
      title: ApproveDraft
    Body_upload_api_v1_transactions__transaction_id__documents_post:
      properties:
        document_type:
          type: string
          enum:
          - invoice
          - order_confirmation
          - delivery_record
          - other
          title: Document Type
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - document_type
      - file
      title: Body_upload_api_v1_transactions__transaction_id__documents_post
    Capabilities:
      properties:
        analysis_engine:
          type: string
          const: ai_engine_v1
          title: Analysis Engine
          default: ai_engine_v1
        data_mode:
          type: string
          const: synthetic
          title: Data Mode
          default: synthetic
        persistence:
          type: string
          enum:
          - temporary
          - postgresql
          title: Persistence
          default: temporary
        ocr:
          type: string
          enum:
          - unavailable
          - local
          title: Ocr
          default: unavailable
        uploads:
          type: boolean
          const: true
          title: Uploads
          default: true
      additionalProperties: false
      type: object
      title: Capabilities
